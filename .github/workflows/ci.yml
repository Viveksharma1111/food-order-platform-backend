name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: food_order_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d food_order_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_user:ci_only_password@localhost:5432/food_order_platform_test?schema=public
      JWT_SECRET: ci-only-secret-for-integration-tests-32-characters-min
      JWT_EXPIRES_IN: 1h
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Configure isolated test environment
        run: |
          printf 'DATABASE_URL=%s\nJWT_SECRET=%s\nJWT_EXPIRES_IN=%s\nPORT=%s\nCORS_ORIGIN=%s\n' \
            "$DATABASE_URL" "$JWT_SECRET" "$JWT_EXPIRES_IN" "$PORT" "$CORS_ORIGIN" > .env.test
      - name: Apply database migrations
        run: npm run db:deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
